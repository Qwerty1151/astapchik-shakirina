<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="favicon.ico">
  <title>astapchik-shakirina</title>
  <style>
    :root{--bg:#0b0f1a;--fg:#e6eef2;--card:#111827}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;display:flex;align-items:center;justify-content:center;
      background:var(--bg);color:var(--fg);
      /* фикс рендера шрифтов */
      font-family: Arial, "Helvetica Neue", Helvetica, Roboto, "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-kerning: none;
      font-feature-settings: "liga" 0, "clig" 0, "kern" 0;
      text-rendering: optimizeSpeed;
      font-size:16px; line-height:1.6;
    }
    .card{
      max-width:720px;margin:32px;border-radius:16px;background:var(--card);
      padding:32px;box-shadow:0 6px 30px rgba(0,0,0,.25);text-align:center;overflow:visible;
    }
    h1{margin:0 0 12px;font-size:28px;font-weight:700}
    p{margin:0;color:#aab4c3}
    a.btn{display:inline-block;margin-top:16px;padding:10px 16px;border-radius:10px;text-decoration:none;background:#2563eb;color:#fff}
  </style>
</head>
<body>
  <main class="card">
    <h1>отовим сайт к запуску</h1>
    <p>Статическая версия без Bitrix. альше наполним контентом.</p>
    <p><a class="btn" href="https://github.com/Qwerty1151/astapchik-shakirina/tree/vetka2">ткрыть ветку на GitHub</a></p>
  </main>
</body>
</html>
